<text x="116" y="939" font-family="Segoe UI, sans-serif" font-size="15" font-weight="400" fill="#52636B">
<tspan x="116" dy="0">Có thể mô tả bài toán khi chưa biết model.</tspan>
</text>
<text x="104" y="1076" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#172B35">
<tspan x="104" dy="0">Nơi giao / thời điểm cần (tùy chọn)</tspan>
</text>
<rect x="104" y="1088" width="770" height="48" rx="8" fill="#FFFFFF" stroke="#75858D"/>
<rect x="104" y="1178" width="770" height="48" rx="8" fill="#006B63" stroke="#006B63"/>
<text x="116" y="1205.0" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">
<tspan x="116" dy="0">Gửi yêu cầu báo giá</tspan>
</text>
<rect x="930" y="452" width="430" height="338" rx="12" fill="#FFFFFF" stroke="#D9E1E5"/>
<text x="954" y="499" font-family="Segoe UI, sans-serif" font-size="25" font-weight="600" fill="#172B35">
<tspan x="954" dy="0">Quy trình báo giá</tspan>
</text>
<text x="954" y="561" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#172B35">
<tspan x="954" dy="0">1. Tiếp nhận nhu cầu</tspan>
</text>
<text x="954" y="627" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#172B35">
<tspan x="954" dy="0">2. Trao đổi và xác nhận</tspan>
</text>
<text x="954" y="693" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#172B35">
<tspan x="954" dy="0">3. Gửi báo giá đã duyệt</tspan>
</text>
<text x="930" y="845" font-family="Segoe UI, sans-serif" font-size="17" font-weight="400" fill="#52636B">
<tspan x="930" dy="0">* Trường bắt buộc.</tspan>
<tspan x="930" dy="26">Sau khi tiếp nhận, nhân viên sẽ liên hệ qua</tspan>
<tspan x="930" dy="26">kênh bạn cung cấp.</tspan>
</text>
