<tspan x="80" dy="0">Yêu cầu báo giá</tspan>
</text>
<rect x="80" y="340" width="1280" height="84" rx="12" fill="#E7F4F1" stroke="#D9E1E5"/>
<text x="104" y="382" font-family="Segoe UI, sans-serif" font-size="18" font-weight="400" fill="#172B35">
<tspan x="104" dy="0">Gửi nhu cầu để được tư vấn và báo giá. Yêu cầu này chưa phải đơn hàng và chưa giữ hàng.</tspan>
</text>
<rect x="80" y="452" width="818" height="810" rx="12" fill="#FFFFFF" stroke="#D9E1E5"/>
<text x="104" y="488" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#172B35">
