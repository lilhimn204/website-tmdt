</text>
<text x="16" y="307" font-family="Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#172B35">
<tspan x="16" dy="0">1. Thông tin liên hệ</tspan>
</text>
<text x="16" y="347" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#172B35">
