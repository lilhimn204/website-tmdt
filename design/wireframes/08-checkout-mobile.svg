<rect x="0" y="0" width="390" height="64" rx="0" fill="#172B35" stroke="none"/>
<text x="16" y="25" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">
<tspan x="16" dy="0">DES08 · Checkout</tspan>
</text>
<text x="16" y="47" font-family="Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF">
<tspan x="16" dy="0">WIREFRAME • 390 px • Dữ liệu giữ chỗ</tspan>
</text>
<rect x="0" y="64" width="390" height="64" rx="0" fill="#FFFFFF" stroke="none"/>
<text x="16" y="99" font-family="Segoe UI, sans-serif" font-size="15" font-weight="400" fill="#172B35">
<tspan x="16" dy="0">Menu</tspan>
</text>
<text x="80" y="100" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#172B35">
