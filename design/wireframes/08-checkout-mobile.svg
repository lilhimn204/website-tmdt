</text>
<rect x="16" y="703" width="358" height="48" rx="8" fill="#FFFFFF" stroke="#75858D"/>
<text x="16" y="789" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#172B35">
<tspan x="16" dy="0">Địa bàn giao hàng *</tspan>
</text>
<rect x="16" y="801" width="358" height="48" rx="8" fill="#FFFFFF" stroke="#75858D"/>
<text x="28" y="828" font-family="Segoe UI, sans-serif" font-size="15" font-weight="400" fill="#52636B">
