</text>
<rect x="16" y="359" width="358" height="48" rx="8" fill="#FFFFFF" stroke="#75858D"/>
<text x="16" y="445" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#172B35">
<tspan x="16" dy="0">Điện thoại *</tspan>
</text>
<rect x="16" y="457" width="358" height="48" rx="8" fill="#FFFFFF" stroke="#75858D"/>
<text x="16" y="543" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#172B35">
<tspan x="16" dy="0">Email (tùy chọn)</tspan>
</text>
<rect x="16" y="555" width="358" height="48" rx="8" fill="#FFFFFF" stroke="#75858D"/>
<text x="16" y="649" font-family="Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#172B35">
<tspan x="16" dy="0">2. Địa chỉ giao hàng</tspan>
</text>
<text x="16" y="691" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#172B35">
