</text>
<text x="16" y="953" font-family="Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#172B35">
<tspan x="16" dy="0">3. Giao hàng &amp; thanh toán</tspan>
</text>
<rect x="16" y="1011" width="358" height="86" rx="12" fill="#E7F4F1" stroke="#D9E1E5"/>
<text x="32" y="1045" font-family="Segoe UI, sans-serif" font-size="16" font-weight="400" fill="#172B35">
<tspan x="32" dy="0">[Phương thức giao / phí được xác</tspan>
<tspan x="32" dy="24">nhận]</tspan>
</text>
<rect x="16" y="1121" width="358" height="66" rx="12" fill="#FFFFFF" stroke="#D9E1E5"/>
<text x="32" y="1155" font-family="Segoe UI, sans-serif" font-size="16" font-weight="400" fill="#172B35">
<tspan x="32" dy="0">○ COD — khi đơn đủ điều kiện</tspan>
</text>
<rect x="16" y="1203" width="358" height="66" rx="12" fill="#FFFFFF" stroke="#D9E1E5"/>
<text x="32" y="1237" font-family="Segoe UI, sans-serif" font-size="16" font-weight="400" fill="#172B35">
<tspan x="32" dy="0">○ Chuyển khoản thủ công</tspan>
</text>
<text x="16" y="1308" font-family="Segoe UI, sans-serif" font-size="23" font-weight="600" fill="#172B35">
<tspan x="16" dy="0">4. Rà soát đơn hàng</tspan>
</text>
<rect x="16" y="1337" width="358" height="286" rx="12" fill="#FFFFFF" stroke="#D9E1E5"/>
<text x="32" y="1371" font-family="Segoe UI, sans-serif" font-size="16" font-weight="400" fill="#172B35">
<tspan x="32" dy="0">[Toàn bộ SKU / số lượng trong giỏ]</tspan>
</text>
<text x="32" y="1440" font-family="Segoe UI, sans-serif" font-size="16" font-weight="400" fill="#172B35">
<tspan x="32" dy="0">Tạm tính: [Số tiền]</tspan>
<tspan x="32" dy="24">Thuế / phí: [Đã xác nhận]</tspan>
</text>
<rect x="32" y="1513" width="326" height="1" rx="0" fill="#D9E1E5" stroke="none"/>
<text x="32" y="1556" font-family="Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#172B35">
<tspan x="32" dy="0">Tổng: [Số tiền cuối]</tspan>
</text>
<text x="16" y="1666" font-family="Segoe UI, sans-serif" font-size="15" font-weight="400" fill="#172B35">
<tspan x="16" dy="0">Rà soát địa chỉ, phương thức và điều kiện</tspan>
<tspan x="16" dy="23">giao dịch trước khi đặt.</tspan>
</text>
<rect x="16" y="1751" width="358" height="48" rx="8" fill="#006B63" stroke="#006B63"/>
<text x="28" y="1778.0" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">
<tspan x="28" dy="0">Đặt hàng</tspan>
</text>
<text x="16" y="1842" font-family="Segoe UI, sans-serif" font-size="15" font-weight="400" fill="#52636B">
<tspan x="16" dy="0">Sau khi tiếp nhận: mã đơn và hướng dẫn</tspan>
<tspan x="16" dy="23">bước tiếp theo. Chuyển khoản chờ đối soát.</tspan>
</text>
<rect x="0" y="1925" width="390" height="200" rx="0" fill="#FFFFFF" stroke="none"/>
<rect x="0" y="1925" width="390" height="1" rx="0" fill="#D9E1E5" stroke="none"/>
<text x="16" y="1969" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#172B35">
<tspan x="16" dy="0">Tên website</tspan>
</text>
<text x="16" y="2001" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#172B35">
<tspan x="16" dy="0">Danh mục • Thương hiệu • Báo giá</tspan>
</text>
<text x="16" y="2037" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#52636B">
