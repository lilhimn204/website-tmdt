</text>
<rect x="16" y="1048" width="358" height="48" rx="8" fill="#FFFFFF" stroke="#006B63"/>
<text x="28" y="1075.0" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#006B63">
<tspan x="28" dy="0">Thêm dòng sản phẩm</tspan>
</text>
<text x="16" y="1142" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#172B35">
<tspan x="16" dy="0">Mô tả nhu cầu *</tspan>
</text>
<rect x="16" y="1154" width="358" height="150" rx="8" fill="#FFFFFF" stroke="#75858D"/>
<text x="28" y="1181" font-family="Segoe UI, sans-serif" font-size="15" font-weight="400" fill="#52636B">
<tspan x="28" dy="0">Có thể mô tả khi chưa biết model.</tspan>
</text>
<text x="16" y="1350" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#172B35">
<tspan x="16" dy="0">Nơi giao / thời điểm cần (tùy chọn)</tspan>
</text>
<rect x="16" y="1362" width="358" height="48" rx="8" fill="#FFFFFF" stroke="#75858D"/>
<rect x="16" y="1444" width="358" height="48" rx="8" fill="#006B63" stroke="#006B63"/>
<text x="28" y="1471.0" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">
<tspan x="28" dy="0">Gửi yêu cầu báo giá</tspan>
</text>
<text x="16" y="1545" font-family="Segoe UI, sans-serif" font-size="21" font-weight="600" fill="#172B35">
<tspan x="16" dy="0">Tiếp nhận → Trao đổi → Báo giá</tspan>
</text>
<text x="16" y="1623" font-family="Segoe UI, sans-serif" font-size="15" font-weight="400" fill="#52636B">
<tspan x="16" dy="0">Sau khi tiếp nhận, nhân viên sẽ liên hệ</tspan>
<tspan x="16" dy="23">qua kênh bạn cung cấp.</tspan>
</text>
<rect x="0" y="1706" width="390" height="200" rx="0" fill="#FFFFFF" stroke="none"/>
<rect x="0" y="1706" width="390" height="1" rx="0" fill="#D9E1E5" stroke="none"/>
<text x="16" y="1750" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#172B35">
<tspan x="16" dy="0">Tên website</tspan>
</text>
<text x="16" y="1782" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#172B35">
<tspan x="16" dy="0">Danh mục • Thương hiệu • Báo giá</tspan>
</text>
<text x="16" y="1818" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#52636B">
<tspan x="16" dy="0">Hỗ trợ • Chính sách • Liên hệ</tspan>
</text>
</svg>