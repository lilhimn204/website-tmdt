<text x="124" y="1166" font-family="Segoe UI, sans-serif" font-size="17" font-weight="400" fill="#172B35">
<tspan x="124" dy="0">○ Chuyển khoản thủ công</tspan>
</text>
<rect x="914" y="323" width="446" height="636" rx="12" fill="#FFFFFF" stroke="#D9E1E5"/>
<text x="938" y="369" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#172B35">
<tspan x="938" dy="0">4. Rà soát đơn hàng</tspan>
</text>
<text x="938" y="423" font-family="Segoe UI, sans-serif" font-size="16" font-weight="400" fill="#172B35">
<tspan x="938" dy="0">[Toàn bộ SKU / số lượng trong giỏ]</tspan>
</text>
<text x="938" y="510" font-family="Segoe UI, sans-serif" font-size="16" font-weight="400" fill="#172B35">
<tspan x="938" dy="0">Tạm tính: [Số tiền]</tspan>
<tspan x="938" dy="24">Thuế: [Đã xác nhận]</tspan>
<tspan x="938" dy="24">Phí giao: [Đã xác nhận]</tspan>
</text>
<rect x="938" y="605" width="398" height="1" rx="0" fill="#D9E1E5" stroke="none"/>
<text x="938" y="655" font-family="Segoe UI, sans-serif" font-size="25" font-weight="600" fill="#172B35">
<tspan x="938" dy="0">Tổng: [Số tiền cuối]</tspan>
</text>
<text x="938" y="715" font-family="Segoe UI, sans-serif" font-size="16" font-weight="400" fill="#172B35">
<tspan x="938" dy="0">Rà soát địa chỉ, phương thức và điều kiện</tspan>
<tspan x="938" dy="24">giao dịch trước khi đặt.</tspan>
</text>
<rect x="938" y="820" width="398" height="48" rx="8" fill="#006B63" stroke="#006B63"/>
<text x="950" y="847.0" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">
<tspan x="950" dy="0">Đặt hàng</tspan>
</text>
<text x="938" y="907" font-family="Segoe UI, sans-serif" font-size="16" font-weight="400" fill="#006B63">
<tspan x="938" dy="0">Quay lại sửa giỏ</tspan>
</text>
<rect x="914" y="983" width="446" height="180" rx="12" fill="#E7F4F1" stroke="#D9E1E5"/>
<text x="938" y="1024" font-family="Segoe UI, sans-serif" font-size="21" font-weight="600" fill="#172B35">
<tspan x="938" dy="0">Sau khi tiếp nhận</tspan>
</text>
<text x="938" y="1065" font-family="Segoe UI, sans-serif" font-size="16" font-weight="400" fill="#172B35">
<tspan x="938" dy="0">Hiển thị mã đơn và hướng dẫn bước tiếp theo.</tspan>
<tspan x="938" dy="24">Chuyển khoản vẫn chờ đối soát.</tspan>
</text>
