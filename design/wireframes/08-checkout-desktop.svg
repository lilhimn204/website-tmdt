<text x="104" y="643" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#172B35">
<tspan x="104" dy="0">2. Địa chỉ giao hàng</tspan>
</text>
<text x="104" y="691" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#172B35">
