</text>
<rect x="104" y="431" width="364" height="48" rx="8" fill="#FFFFFF" stroke="#75858D"/>
<text x="492" y="419" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#172B35">
<tspan x="492" dy="0">Điện thoại *</tspan>
</text>
<rect x="492" y="431" width="366" height="48" rx="8" fill="#FFFFFF" stroke="#75858D"/>
<text x="104" y="521" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#172B35">
